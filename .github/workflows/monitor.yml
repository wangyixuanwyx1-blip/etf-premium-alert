name: ETF Premium Monitor

on:
  schedule:
    # 北京时间 09:30-11:30 与 13:00-15:30（含收盘后快照窗口），周一至周五
    # UTC = 北京时间 - 8 小时 → 01:30-03:30 与 05:00-07:00
    - cron: '*/5 1-3,5-7 * * 1-5'
  workflow_dispatch:  # 支持在 GitHub 页面手动触发，用于部署后验证

permissions:
  contents: write   # 允许把 state.json 提交回仓库，实现跨运行去重

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run monitor
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        run: python monitor.py

      - name: Commit alert state
        run: |
          git config user.name "etf-monitor-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "chore: update alert state $(date -u +%Y%m%dT%H%M%SZ)"
          git push
